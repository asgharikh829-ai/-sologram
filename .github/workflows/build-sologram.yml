name: Build Sologram APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      SLOGRAM_API_ID: ${{ secrets.SLOGRAM_API_ID }}
      SLOGRAM_API_HASH: ${{ secrets.SLOGRAM_API_HASH }}
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          df -h

      - name: Checkout Sologram and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android build dependencies
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Restore Android native build cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj/build/intermediates/ndkBuild
          key: sologram-native-${{ runner.os }}-ndk27-cmake322-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle', 'gradle.properties') }}
          restore-keys: |
            sologram-native-${{ runner.os }}-ndk27-cmake322-

      - name: Configure stable Sologram signing key
        shell: bash
        run: |
          {
            echo "SLOGRAM_KEYSTORE_PATH=$GITHUB_WORKSPACE/TMessagesProj/config/release.keystore"
            echo "SLOGRAM_KEYSTORE_PASSWORD=android"
            echo "SLOGRAM_KEY_ALIAS=androidkey"
            echo "SLOGRAM_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Build Sologram release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 --build-cache \
            :TMessagesProj_App:assembleAfatRelease \
            --stacktrace

      - name: Upload Sologram APK
        uses: actions/upload-artifact@v4
        with:
          name: Sologram-Android-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 30
