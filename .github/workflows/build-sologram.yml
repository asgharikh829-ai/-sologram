name: Build Sologram APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          df -h

      - name: Checkout Sologram and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Create temporary Sologram signing key
        shell: bash
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/sologram-ci.jks" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias sologram \
            -dname "CN=Sologram CI, OU=Android, O=Sologram, C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "SLOGRAM_KEYSTORE_PATH=$RUNNER_TEMP/sologram-ci.jks"
            echo "SLOGRAM_KEYSTORE_PASSWORD=$PASSWORD"
            echo "SLOGRAM_KEY_ALIAS=sologram"
            echo "SLOGRAM_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Sologram release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            :TMessagesProj_App:assembleAfatRelease \
            --stacktrace

      - name: Upload Sologram APK
        uses: actions/upload-artifact@v4
        with:
          name: Sologram-Android-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 30
